[pytest]
# ============================================================
# pytest 配置文件
# 这个文件的位置决定「项目根目录」，import 都从这里算起
# ============================================================

# tests     = 框架自测（离线、秒级）
# testcases = 通用用例：对任意站点都成立，--site 选测谁
# sites     = 各被测系统自己的用例（sites/<站>/tests/），_ 开头的是模板不收集
testpaths = tests testcases sites
norecursedirs = _* .* __pycache__ reports

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---- 默认参数：每次执行都会自动带上 ----
addopts =
    -v
    -s
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/report.html
    --self-contained-html

# ---- 标记注册 ----
# 用法： pytest -m smoke        只跑冒烟
#        pytest -m "ui and p0"  组合条件
#        pytest -m "not crawl"  排除某类
# --strict-markers 保证写错标记名会直接报错，而不是静默忽略
markers =
    unit: 框架自测，纯离线不联网，改完框架先跑这一组
    smoke: 冒烟测试，核心流程，每次提测必跑
    ui: UI 自动化测试
    api: 接口自动化测试
    perf: 性能测试
    security: 安全测试
    crawl: 站点巡检（由爬虫自动生成的用例）
    visual: 视觉回归与接口结构回归
    a11y: 可访问性测试（WCAG 2.1 AA / axe-core）
    responsive: 响应式布局，多档视口
    crossbrowser: 跨浏览器兼容性，配合 --browser-engine 使用
    vitals: 前端性能指标与性能预算（Core Web Vitals）
    resilience: 容错测试，主动注入网络/依赖故障
    seeded: 检测能力验证，用已知缺陷账号做对照实验
    wallet: 资金链路：幂等/并发/精度/对账，自带本地钱包服务
    gameconfig: 游戏配置表校验：概率/经验曲线/引用完整性/活动时间
    android: 安卓手机模拟：机型/触屏/横竖屏/弱网，只在 chromium 下跑
    p0: 最高优先级，阻塞级功能
    p1: 高优先级，主要功能
    p2: 中优先级，次要功能
    negative: 反向用例，验证错误处理
    mock: 需要本地 mock 服务，用 pytest --mock 才会真跑
    account_role: 指定用例需要的账号角色，如 @pytest.mark.account_role("admin")

# ---- 日志 ----
log_cli = false
log_cli_level = INFO
log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)-18s | %(message)s
log_file_date_format = %H:%M:%S
