# ============================================================
# 接口登录校验用例数据（对应 API 7/8/10）
#
# 覆盖维度：
#   正向    —— 正确账号密码
#   反向    —— 密码错误、账号不存在
#   参数缺失 —— 只传一个参数、全部不传
#
# 这四类正好是接口测试的标准套路，面试常问「接口用例怎么设计」，
# 答：正向 + 反向 + 参数校验 + 权限校验 + 边界值 + 幂等性。
# ============================================================

cases:
  - id: API_LOGIN_001
    title: 登录接口-密码错误
    method: 等价类划分-无效等价类
    email: "wrong_pwd_test@example.com"
    password: "definitely_wrong_password"
    expect_code: 404
    expect_message: "User not found!"

  - id: API_LOGIN_002
    title: 登录接口-账号不存在
    method: 等价类划分-无效等价类
    email: "nobody_here_2024_qa@example.com"
    password: "Test@12345"
    expect_code: 404
    expect_message: "User not found!"

  - id: API_LOGIN_003
    title: 登录接口-缺少email参数
    method: 参数校验-必填项缺失
    email: null
    password: "Test@12345"
    expect_code: 400
    expect_message: "Bad request, email or password parameter is missing in POST request."

  - id: API_LOGIN_004
    title: 登录接口-缺少password参数
    method: 参数校验-必填项缺失
    email: "some_user@example.com"
    password: null
    expect_code: 400
    expect_message: "Bad request, email or password parameter is missing in POST request."

  - id: API_LOGIN_005
    title: 登录接口-两个参数都不传
    method: 参数校验-全部缺失
    email: null
    password: null
    expect_code: 400
    expect_message: "Bad request, email or password parameter is missing in POST request."
