# ============================================================
# 登录用例数据（UI 层）
#
# 设计方法标注：
#   等价类划分 —— 把输入分成「有效类」和「无效类」，每类取代表值
#   边界值分析 —— 取边界上和边界外的值（空、超长、单字符）
#
# 面试时可以直接指着这个文件讲用例设计方法，非常有说服力。
# ============================================================

cases:
  - id: LOGIN_002
    title: 登录-密码错误
    method: 等价类划分-无效等价类
    email: "valid_but_wrong@example.com"
    password: "WrongPassword123"
    expect_success: false
    expect_error: "Your email or password is incorrect!"

  - id: LOGIN_003
    title: 登录-账号不存在
    method: 等价类划分-无效等价类
    email: "not_exist_user_9527@example.com"
    password: "AnyPassword123"
    expect_success: false
    expect_error: "Your email or password is incorrect!"

  - id: LOGIN_004
    title: 登录-邮箱格式非法
    method: 等价类划分-无效等价类
    email: "this_is_not_an_email"
    password: "Test@12345"
    expect_success: false
    expect_error: ""            # 浏览器原生校验拦截，页面无提示文案

  - id: LOGIN_005
    title: 登录-密码为空
    method: 边界值分析-下边界
    email: "some_user@example.com"
    password: ""
    expect_success: false
    expect_error: ""

  - id: LOGIN_006
    title: 登录-邮箱为空
    method: 边界值分析-下边界
    email: ""
    password: "Test@12345"
    expect_success: false
    expect_error: ""

  - id: LOGIN_007
    title: 登录-超长邮箱
    method: 边界值分析-上边界外
    email: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@example.com"
    password: "Test@12345"
    expect_success: false
    expect_error: ""

  - id: LOGIN_008
    title: 登录-密码含特殊字符
    method: 等价类划分-特殊字符类
    email: "special_char_user@example.com"
    password: "'; DROP TABLE users; --"
    expect_success: false
    expect_error: ""
