machine_check: 通过
cases:
- id: AI_001
  title: 充值普通有效金额成功
  method: 等价类
  api: /wallet/deposit
  amount: '100.00'
  expect_code: 200
  why: 有效等价类的代表值，确认主流程可用
- id: AI_002
  title: 充值最小正金额0.01成功
  method: 边界值
  api: /wallet/deposit
  amount: '0.01'
  expect_code: 200
  why: 大于0且两位小数的下边界，是最小合法值
- id: AI_003
  title: 充值金额为0被拒绝
  method: 边界值
  api: /wallet/deposit
  amount: '0'
  expect_code: 400
  why: 规则要求必须大于0，0是下边界外的第一个点
- id: AI_004
  title: 充值负数金额被拒绝
  method: 等价类
  api: /wallet/deposit
  amount: '-1.00'
  expect_code: 400
  why: 负数属于无效等价类，防止反向加钱
- id: AI_005
  title: 充值恰好单笔上限50000.00成功
  method: 边界值
  api: /wallet/deposit
  amount: '50000.00'
  expect_code: 200
  why: 上限含等于，上边界本身必须能通过
- id: AI_006
  title: 充值超上限一分50000.01被拒绝
  method: 边界值
  api: /wallet/deposit
  amount: '50000.01'
  expect_code: 400
  why: 上边界外最小步长一分，最容易暴露比较符写错
- id: AI_007
  title: 充值三位小数金额被拒绝
  method: 边界值
  api: /wallet/deposit
  amount: '0.001'
  expect_code: 400
  why: 最多两位小数，三位小数是精度边界外的值
- id: AI_008
  title: 充值金额为字母被拒绝
  method: 等价类
  api: /wallet/deposit
  amount: abc
  expect_code: 400
  why: 非数字字符属于无效等价类
- id: AI_009
  title: 充值金额为NaN被拒绝
  method: 错误推测
  api: /wallet/deposit
  amount: NaN
  expect_code: 400
  why: float能解析NaN且任何比较都为假，容易绕过大于0校验
- id: AI_010
  title: 充值金额为空字符串被拒绝
  method: 错误推测
  api: /wallet/deposit
  amount: ''
  expect_code: 400
  why: 空值容易被当成未传参数或按0处理，需明确拒绝
- id: AI_011
  title: 提现金额小于余额成功
  method: 等价类
  api: /wallet/withdraw
  setup_deposit: '100.00'
  amount: '50.00'
  expect_code: 200
  why: 余额充足属于提现的有效等价类
- id: AI_012
  title: 提现金额恰好等于余额成功
  method: 边界值
  api: /wallet/withdraw
  setup_deposit: '100.00'
  amount: '100.00'
  expect_code: 200
  why: 不能超过余额即允许等于，这是余额的上边界
- id: AI_013
  title: 提现超余额一分被拒绝
  method: 边界值
  api: /wallet/withdraw
  setup_deposit: '100.00'
  amount: '100.01'
  expect_code: 400
  why: 余额边界外最小步长，检验超扣判断是否用了大于等于
- id: AI_014
  title: 零余额提现被拒绝
  method: 场景法
  api: /wallet/withdraw
  amount: '0.01'
  expect_code: 400
  why: 新用户没充值直接提现，最小金额也应因余额不足失败
- id: AI_015
  title: 提现金额为0被拒绝
  method: 边界值
  api: /wallet/withdraw
  setup_deposit: '100.00'
  amount: '0'
  expect_code: 400
  why: 余额充足时单独验证提现也执行了大于0校验
